human_accepted_source_facts:
  - GSN is a generic graphical argument notation for documenting claims, evidence references, contextual information, and relationships among them.
  - Version 3 separates a normative notation definition from informative guidance for developing and evaluating goal structures.
  - Core GSN represents goals, strategies, solutions, contexts, assumptions, and justifications connected through SupportedBy and InContextOf relations.
  - GSN documents an asserted argument and does not, by use of the notation alone, establish the truth of that argument.

mandatory_interpretation_boundaries:
  - GSN notation and well-formedness do not prove argument truth or evidence truth.
  - A GSN Solution reference does not establish evidence authenticity, completeness, or correct binding.
  - GSN does not establish medical identity, authorization, workflow closure, clinical validity, or regulatory validity.
  - GSN inclusion does not establish EOA novelty, GSN conformance, implementation readiness, or benchmark validity.
  - GSN is a bounded comparison and baseline-design source; it is not an EOA validator.

