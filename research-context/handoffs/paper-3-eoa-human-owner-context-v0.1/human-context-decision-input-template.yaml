submission_rules:
  - Every source decision must be explicit; null is not a decision.
  - Every pending research decision must be explicit; silence does not confirm a recommendation.
  - Every Unknown must be reviewed; a disposition does not itself resolve the Unknown, and any later resolution requires a traceable resolution reference and statement.
  - Autonomy preference must be explicitly selected by the Human Research Owner; null does not imply APPROVAL_REQUIRED or any other level.
  - Human identity, timestamp, and attestation must be present before this input can support a canonical Review Record.
  - This template must not be edited in place into a Review Record; preserve it and create a separate Human-authored submission or record.

